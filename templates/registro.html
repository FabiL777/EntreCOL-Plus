
<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | EntreCOL+</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: linear-gradient(135deg, #081225, #142b4e);
            font-family: Arial, sans-serif;
            color: #eaf0fa;
        }

        .registro-card {
            width: 100%;
            max-width: 440px;
            background: #14243d;
            border: 1px solid #304563;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, .25);
        }

        .marca {
            text-align: center;
            color: #69b5ff;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            font-size: 23px;
            margin: 0 0 8px;
        }

        .subtitulo {
            text-align: center;
            color: #aebdd3;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .campo {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #405674;
            border-radius: 8px;
            background: #0c1a30;
            color: white;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #69b5ff;
        }

        .ayuda {
            color: #aebdd3;
            font-size: 12px;
            margin-top: 6px;
        }

        .boton {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2784e8;
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 8px;
        }

        .boton:hover {
            background: #126bcc;
        }

        .errores {
            background: #48252c;
            border: 1px solid #b75c69;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .errores p {
            margin: 5px 0;
        }

        .pie {
            text-align: center;
            font-size: 14px;
            margin-top: 24px;
            color: #aebdd3;
        }

        a {
            color: #69b5ff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
        <script
    src="https://challenges.cloudflare.com/turnstile/v0/api.js"
    async
    defer>
</script>
</head>

<body>
    <main class="registro-card">
        <div class="marca">EntreCOL+</div>

        <h1>Crear cuenta</h1>

        <p class="subtitulo">
            Regístrate para descubrir libros, películas y guardar tus favoritos.
        </p>

        {% if errores %}
        <div class="errores" role="alert">
            {% for error in errores %}
                <p>{{ error }}</p>
            {% endfor %}
        </div>
        {% endif %}

        <form action="{{ url_for('registro') }}" method="POST">
            <input type="hidden"
                   name="csrf_token"
                   value="{{ csrf_token() }}">

            <div class="campo">
                <label for="nombre_usuario">Nombre de usuario</label>
                <input
                    type="text"
                    id="nombre_usuario"
                    name="nombre_usuario"
                    maxlength="60"
                    minlength="3"
                    autocomplete="username"
                    value="{{ datos.get('nombre_usuario', '') }}"
                    required
                >
                <div class="ayuda">
                    Entre 3 y 60 caracteres.
                </div>
            </div>

            <div class="campo">
                <label for="correo_electronico">Correo electrónico</label>
                <input
                    type="email"
                    id="correo_electronico"
                    name="correo_electronico"
                    maxlength="150"
                    autocomplete="email"
                    value="{{ datos.get('correo_electronico', '') }}"
                    required
                >
            </div>

            <div class="campo">
                <label for="contrasena">Contraseña</label>
                <input
                    type="password"
                    id="contrasena"
                    name="contrasena"
                    minlength="8"
                    maxlength="128"
                    autocomplete="new-password"
                    required
                >
                <div class="ayuda">
                    Utiliza una contraseña única de al menos 8 caracteres.
                </div>
            </div>

            <div class="campo">
                <label for="confirmar_contrasena">
                    Confirmar contraseña
                </label>
                <input
                    type="password"
                    id="confirmar_contrasena"
                    name="confirmar_contrasena"
                    minlength="8"
                    maxlength="128"
                    autocomplete="new-password"
                    required
                >
            </div>
        <div style="margin: 20px 0; display: flex; justify-content: center;">
            <div
                class="cf-turnstile"
                data-sitekey="{{ turnstile_site_key }}"
                data-theme="dark">
            </div>
        </div>
            <button class="boton" type="submit">
                Crear mi cuenta
            </button>
        </form>

        <div class="pie">
            ¿Ya tienes una cuenta?
            <a href="{{ url_for('login') }}">Iniciar sesión</a>
        </div>
    </main>
</body>
</html>
