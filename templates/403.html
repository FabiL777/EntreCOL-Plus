
<!DOCTYPE html>
<html lang="es">

<head>

    <title>Acceso denegado | EntreCOL+</title>

    <link rel="stylesheet"

<body class="error-page">

    <main class="error-container">

        <div class="error-card">

            <div class="error-icon">🔒</div>

                del sistema.
            </p>

            <a href="{{ url_for('pagina_publica') }}"
               class="error-back-button">
                Volver al inicio
            </a>

        </div>

    </main>

</body>
</html>
